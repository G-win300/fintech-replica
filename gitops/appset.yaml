apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fintech-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/G-win300/fintech-replica.git
        revision: master
        files:
          - path: gitops/values/*.yaml
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/G-win300/fintech-replica.git
        targetRevision: master
        path: charts/microservice
        helm:
          valueFiles:
            - ../../gitops/values/{{ .name }}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: kuda
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true