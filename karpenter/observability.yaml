apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: observability
spec:
  template:
    metadata:
      labels:
        workload: observability
    spec:
      taints:
        - key: workload
          value: observability
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]          # NOT spot — ingesters hold unflushed data
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmpty        # NOT WhenEmptyOrUnderutilized
    consolidateAfter: 30m
  limits:
    cpu: "64"
    memory: 256Gi